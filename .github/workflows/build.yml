name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # keeps the same signing key between builds, so a new APK installs over the old one
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jarvis-debug-keystore

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - run: gradle -p android :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
