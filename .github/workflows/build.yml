name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # keeps the same signing key between builds, so a new APK installs over the old one
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jarvis-debug-keystore

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # the small offline model for the wake word goes inside the APK, so the phone never downloads anything
      # If the download fails the APK is still built, only without the wake word.
      - name: Add the wake word model
        continue-on-error: true
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          sha256sum model.zip
          unzip -q model.zip
          test -f vosk-model-small-en-us-0.15/am/final.mdl
          mkdir -p android/app/src/main/assets
          mv vosk-model-small-en-us-0.15 android/app/src/main/assets/model

      - run: gradle -p android :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
